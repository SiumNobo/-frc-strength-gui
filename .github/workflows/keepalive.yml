name: Keep Streamlit Awake
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright && playwright install chromium
      - run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              pg.goto('https://YOUR-APP.streamlit.app', timeout=60000)
              pg.wait_for_timeout(8000)
              try:
                  pg.click('text=Yes, get this app back up', timeout=5000)
              except: pass
              b.close()
          "
